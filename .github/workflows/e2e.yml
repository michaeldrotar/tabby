name: Run E2E Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser workflows
    runs-on: ubuntu-24.04
    env:
      CEB_CI: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @extension/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm test:demo-studio
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-reports
          path: packages/e2e/test-results/
          retention-days: 7
      - run: pnpm test:marketing
