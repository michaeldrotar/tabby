name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/greet-contributor.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const { greetContributor } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/greet-contributor.mjs`).href)
            await greetContributor({ github, context })
